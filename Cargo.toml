[workspace]
resolver = "3"
members = ["crates/flowlanes-wire", "crates/flowlanes-gen"]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "Apache-2.0"
publish = false
rust-version = "1.85"

[workspace.dependencies]
flowlanes-wire = { path = "crates/flowlanes-wire" }
flowlanes-gen = { path = "crates/flowlanes-gen" }
# MIT OR Apache-2.0.
serde_json = { version = "1.0.154", features = ["preserve_order"] }

[workspace.lints.rust]
unsafe_code = "forbid"
